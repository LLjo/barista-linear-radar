<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linear Radar — B · three columns</title>
<link rel="stylesheet" href="tokens.css">
<style>
	/* B: PR Radar's pick carried over: one column per list, TWO lines per issue.
	   Line 1 = unseen dot, priority, title. Line 2 = identifier, why/age, chips; links on the right. */
	.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 14px; }
	@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
	.col { min-width: 0; }
	.col h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; font: 600 var(--t-m) var(--sans); color: var(--ink-2); }
	.col h2 .n { min-width: 18px; padding: 0 6px; border-radius: var(--r-pill); background: var(--raised); font: 500 var(--t-xs)/18px var(--mono); text-align: center; color: var(--ink-2); }
	.col h2 .n.hot { background: var(--accent); color: var(--on-accent); }
	.col h2 .seg { margin-left: auto; }
	.is { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); }
	.is + .is { border-top: 1px solid var(--line); border-radius: 0; }
	.is:hover { background: var(--hover); }
	.is .lead { display: flex; gap: 6px; align-items: center; }
	.is .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.is .line2 { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--t-xs); color: var(--ink-3); }
	.is .side { grid-row: 1 / span 2; grid-column: 3; }
	.divider { margin: 6px 10px; border-top: 1px dashed var(--line-2); font-size: var(--t-xs); color: var(--ink-3); }
</style>
<script src="data.js"></script><script src="toolbar.js"></script>
</head>
<body><div class="stage"><div class="page" id="page"></div></div>
<button class="theme-toggle" onclick="flip()">light / dark</button>
<script>
	themeFromQuery();
	const seg = { assigned: ["All", "In cycle"], mentions: ["All", "Mentions", "Subscribed"], created: ["Open", "Triage"] };
	const card = (i) => `<div class="is ${i.unseen ? "unseen" : "seen"}">
		<span class="lead">${dot(i)}${prio(i.prio)}</span>
		<a class="title" href="${url(i)}" target="_blank" rel="noopener">${esc(i.title)}</a>
		<span class="side">${links(i)}</span>
		<span class="line2"><span class="ident">${i.key}</span>${whyText(i) || `<span>${i.age}</span>`}${i.why ? `<span>· ${i.age}</span>` : ""}${stateChip(i)}${cycleChip(i)}${i.project ? `<span>${esc(i.project)}</span>` : ""}</span></div>`;
	const col = (l) => {
		const rows = listOf(l.id), n = unseenIn(l.id), firstSeen = rows.findIndex((i) => !i.unseen);
		return `<section class="col"><h2>${l.label} <span class="n${n ? " hot" : ""}" title="${n} unseen of ${rows.length}">${n ? n + "/" : ""}${rows.length}</span>
			<span class="seg">${seg[l.id].map((s, k) => `<span class="${k ? "" : "on"}">${s}</span>`).join("")}</span></h2>
			${rows.map((i, k) => (k === firstSeen && k > 0 ? `<div class="divider">seen</div>` : "") + card(i)).join("")}</section>`;
	};
	document.getElementById("page").innerHTML = toolbar() + `<div class="cols">${LISTS.map(col).join("")}</div>`;
</script>
</body>
</html>
