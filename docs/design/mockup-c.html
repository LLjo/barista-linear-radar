<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linear Radar — C · inbox tabs</title>
<link rel="stylesheet" href="tokens.css">
<style>
	/* C: inbox-style. Tabs switch the list (each tab shows its unseen count), filters live in a
	   side panel, and the list is grouped: an "Unseen" group on top, then one group per team.
	   Rows are one line but roomier than A, with the why/age under the title only when unseen. */
	.wrap { display: grid; grid-template-columns: 190px 1fr; gap: 18px; margin-top: 14px; }
	@media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
	aside { font-size: var(--t-s); color: var(--ink-2); display: flex; flex-direction: column; gap: 14px; }
	aside h4 { margin: 0 0 4px; font: 600 var(--t-xs) var(--sans); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
	aside label { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
	aside .count { margin-left: auto; color: var(--ink-3); font: var(--t-xs) var(--mono); }
	.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
	.tabs span { padding: 6px 12px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; }
	.tabs span.on { color: var(--ink); border-color: var(--accent); }
	.tabs b { margin-left: 6px; padding: 0 6px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); font: 600 var(--t-xs)/16px var(--mono); }
	.tabs i { margin-left: 6px; font: normal var(--t-xs) var(--mono); color: var(--ink-3); }
	.grp h3 { margin: 12px 0 2px; padding: 0 10px; font: 500 var(--t-xs) var(--mono); color: var(--ink-3); }
	.grp h3.new { color: var(--accent); }
	.row { display: grid; grid-template-columns: auto auto 64px 1fr auto auto; gap: 2px 8px; align-items: center; padding: 7px 10px; border-radius: var(--r-sm); }
	.row + .row { border-top: 1px solid var(--line); border-radius: 0; }
	.row:hover { background: var(--hover); }
	.row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.row .chips { display: flex; gap: 6px; }
	.row .sub { grid-column: 4 / span 3; font-size: var(--t-xs); color: var(--ink-3); display: flex; gap: 8px; }
	.bar .sync { margin-left: auto; }
</style>
<script src="data.js"></script>
</head>
<body><div class="stage"><div class="page" id="page"></div></div>
<button class="theme-toggle" onclick="flip()">light / dark</button>
<script>
	themeFromQuery();
	const tab = "assigned";
	const row = (i) => `<div class="row ${i.unseen ? "unseen" : "seen"}">${dot(i)}${prio(i.prio)}
		<a class="ident" href="${url(i)}" target="_blank" rel="noopener">${i.key}</a>
		<a class="title" href="${url(i)}" target="_blank" rel="noopener">${esc(i.title)}</a>
		<span class="chips">${stateChip(i)}${cycleChip(i)}</span>${links(i)}
		${i.unseen ? `<span class="sub">${whyText(i) || "updated"} · ${i.age} ago${i.project ? ` · ${esc(i.project)}` : ""}</span>` : ""}</div>`;
	const rows = listOf(tab), unseen = rows.filter((i) => i.unseen), teams = [...new Set(rows.filter((i) => !i.unseen).map((i) => i.team))];
	const teamCount = (t) => ISSUES.filter((i) => i.team === t).length;
	document.getElementById("page").innerHTML = `
		<div class="bar"><h1>Linear Radar</h1>
			<span class="sync"><span class="chip wait">${ISSUES.filter((i) => i.unseen).length} unseen</span> synced 1 min ago <button title="Refresh">↻</button><a class="iconbtn" href="settings.html" title="Settings: API keys">⚙</a></span></div>
		<div class="wrap">
			<aside>
				<div><h4>Workspaces</h4>${["Acme", "Northwind"].map((w) => `<label><input type="checkbox" checked> ${w}<span class="count">${ISSUES.filter((i) => i.ws === w).length}</span></label>`).join("")}</div>
				<div><h4>Teams</h4>${["ENG", "WEB", "DES", "OPS"].map((t) => `<label><input type="checkbox" ${t === "DES" ? "" : "checked"}> ${t}<span class="count">${teamCount(t)}</span></label>`).join("")}</div>
				<div><h4>Only</h4><label><input type="checkbox"> Current cycle</label><label><input type="checkbox"> Urgent + high</label></div>
				<div><h4>Refresh</h4><select><option>1 min</option><option selected>5 min</option><option>15 min</option></select></div>
			</aside>
			<main>
				<div class="tabs">${LISTS.map((l) => `<span class="${l.id === tab ? "on" : ""}">${l.label}${unseenIn(l.id) ? `<b>${unseenIn(l.id)}</b>` : ""}<i>${listOf(l.id).length}</i></span>`).join("")}</div>
				${unseen.length ? `<div class="grp"><h3 class="new">● Unseen</h3>${unseen.map(row).join("")}</div>` : ""}
				${teams.map((t) => `<div class="grp"><h3>${t}</h3>${rows.filter((i) => !i.unseen && i.team === t).map(row).join("")}</div>`).join("")}
			</main>
		</div>`;
</script>
</body>
</html>
